[project]
name = "evga-z12"
version = "0.1.0a1"
description = "Experimental CLI to configure an EVGA Z12 keyboard on macOS via HID feature reports"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["hid>=1.0.0"]

[project.scripts]
z12ctl = "z12ctl:main"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]
ignore = [
    "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["evga_z12"]
